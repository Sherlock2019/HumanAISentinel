services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      AI_PROVIDER: mock
      ADMIN_TOKEN: ${ADMIN_TOKEN:-local-demo-admin}
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["sentinel-data:/app/data"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      SENTINEL_API_TARGET: http://backend:8000
    ports: ["127.0.0.1:5173:5173"]
    depends_on:
      backend:
        condition: service_healthy
volumes:
  sentinel-data:
